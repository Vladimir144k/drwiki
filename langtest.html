<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title data-i18n="title">Калькулятор призыва компаньонов</title>
  <style>
    .lang-btn.active {
      font-weight: bold;
      border-bottom: 2px solid #007bff;
    }
  </style>
</head>
<body>

  <!-- Шапка с переключателем языков -->
  <header>
    <div class="lang-switcher">
      <button data-lang-btn="ru" onclick="setLanguage('ru')">RU</button>
      <button data-lang-btn="en" onclick="setLanguage('en')">EN</button>
    </div>
  </header>

  <!-- Основной контент -->
  <main>
    <h1 data-i18n="title">Калькулятор призыва компаньонов</h1>
    <p data-i18n="subtitle">Рассчитайте шансы и стоимость ресурсов</p>

    <form id="calc-form">
      <label for="level" data-i18n="label_level">Текущий уровень:</label>
      <input type="number" id="level" data-i18n-placeholder="placeholder_level" placeholder="Введите уровень...">
      
      <button type="submit" data-i18n="btn_calculate">Рассчитать</button>
    </form>

    <!-- Вывод динамо-результата из JS -->
    <div id="result"></div>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
